version: '3.8'

services:
  whatsapp-worker:
    build:
      context: ./whatsapp-worker
      dockerfile: Dockerfile
    container_name: cleanflow-wa-worker
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WA_MASTER_KEY=${WA_MASTER_KEY} # AES-256-GCM do session_data, exatamente 32 caracteres
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./whatsapp-worker/logs:/app/logs
      - ./whatsapp-worker/auth:/app/auth # Cache persistente secundário do Baileys
    ports:
      - "3001:3001"
    networks:
      - cleanflow-network

networks:
  cleanflow-network:
    driver: bridge
